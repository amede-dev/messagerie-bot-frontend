name: messagerie_bot
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1       # gestion d'état (providers conversations/chat/bot)
  dio: ^5.4.3                    # client HTTP REST vers le backend Spring Boot
  stomp_dart_client: ^2.0.0      # WebSocket STOMP pour le chat temps réel
  flutter_secure_storage: ^9.2.2 # stockage sécurisé du token JWT
  firebase_messaging: ^15.0.0    # notifications push (FCM)
  hive: ^2.2.3                   # cache local (mode hors-ligne)
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2           # pièces jointes images
  file_picker: ^10.3.7           # pièces jointes documents
  intl: ^0.19.0                  # formatage des heures/dates dans le chat
  uuid: ^4.4.0                   # génération d'identifiants locaux

  record: ^6.0.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

  assets:
    - assets/images/logo_eni.jpeg
    - assets/images/messangeur.png
    - assets/images/icon2.png
